name: Deploy CRM to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest code
        run: |
          set -e
          cd /var/www/reinsteins-crm

          git fetch origin main
          git reset --hard origin/main

          npm ci --omit=dev --ignore-scripts

          # Safe, idempotent, additive-only backfill for the default
          # "Project Administrators" security group (adds any
          # PERMISSION_KEYS row that's missing -- e.g. EPIC_CREATE/
          # FEATURE_CREATE on tenants whose group predates them --
          # never modifies or removes any existing row, never touches
          # any other security group, never touches any other tenant's
          # data). Uses the same server/.env-based config app.js itself
          # already relies on -- no separate credentials needed here.
          # `set -e` above means a non-zero exit here stops the script
          # immediately: the build/restart/health-check steps below
          # never run, so a failed migration can never be followed by a
          # restart into a partially-migrated application, and this
          # step's own output (already printed to the log) is what
          # shows in the Actions UI as the failure reason.
          node server/_migrate_backfill_admin_group_permissions.js

          # Safe, idempotent backfill for the tenant-wide System
          # Administrator flag (users.is_system_administrator). Adds
          # the column + its partial unique index on any tenant that
          # doesn't have them yet, then flags exactly one account per
          # tenant -- Reinsteins by explicit account name (never
          # guessed), every other tenant left untouched with a logged
          # decision needed. Never overwrites an existing flagged
          # account. Same `set -e` reasoning as the step above: a
          # non-zero exit here stops the deploy before the build/
          # restart steps run.
          node server/_migrate_backfill_system_administrator.js

          # Safe, idempotent, additive-only creation of the
          # shift_schedules/shift_schedule_history tables on any
          # tenant that predates this feature (every newly provisioned
          # tenant already gets them from tenantSchema.postgresql.sql).
          # Checks information_schema first and only ever creates --
          # never drops, truncates, or modifies an existing table or
          # row. Same `set -e` reasoning as the steps above: a
          # non-zero exit here stops the deploy before the build/
          # restart steps run.
          node server/_migrate_add_shift_schedules.js

          # Safe, idempotent, additive-only addition of
          # companies.logo_url on the platform database (metadata-only
          # column, no default computation, never touches any existing
          # row's data). Same `set -e` reasoning as the steps above: a
          # non-zero exit here stops the deploy before the build/
          # restart steps run.
          node server/_migrate_add_company_logo.js

          # Safe, idempotent, additive-only creation of
          # email_domains/mailboxes/email_aliases/mailbox_settings on
          # the platform database, copied verbatim from
          # platformSchema.postgresql.sql -- only CREATE TABLE IF NOT
          # EXISTS / CREATE INDEX IF NOT EXISTS / pg_constraint-guarded
          # ALTER TABLE statements, never drops or modifies an existing
          # table or row. Same `set -e` reasoning as the steps above: a
          # non-zero exit here stops the deploy before the build/
          # restart steps run.
          node server/_migrate_add_email_platform_tables.js

          # Safe, idempotent, additive-only addition of
          # assigned_to/assigned_by (+ their FKs/indexes) to epics/
          # features/user_stories on any tenant that predates this
          # feature (every newly provisioned tenant already gets them
          # from tenantSchema.postgresql.sql). Tasks are untouched --
          # they already have these columns from an earlier phase.
          # Checks information_schema/pg_constraint first and only
          # ever adds -- never drops, truncates, or modifies an
          # existing table or row. Must run before the client
          # build/restart below: the updated Epic/Feature/User Story
          # SELECT queries reference these columns unconditionally, so
          # a not-yet-migrated tenant would otherwise fail every
          # Epic/Feature/User Story fetch as soon as the new code goes
          # live. Same `set -e` reasoning as the steps above: a
          # non-zero exit here stops the deploy before the build/
          # restart steps run.
          node server/_migrate_add_workitem_assignment.js

          # Mandatory password change. Adds users.must_change_password and
          # users.password_changed_at to the legacy database and every
          # registered tenant database, and -- ONLY in the run that first
          # creates the column, in the same transaction -- flags the existing
          # employee accounts (role employee; not Admin/Super Admin, not a
          # pending self-registration) so each must replace their temporary
          # password at their next login. Later runs find the column and change
          # nothing, so nobody who already changed their password is flagged
          # again (the decision is made inside the transaction under a lock, so
          # an overlapping run cannot re-flag). Reads/writes/logs no password
          # or hash. A legacy database that does not exist is skipped; any other
          # failure -- including an unreachable registered tenant database --
          # exits non-zero. Must run BEFORE the restart below: the new login
          # code selects these columns. Same `set -e` reasoning as the steps
          # above. `--dry-run` previews it (never used here).
          node server/_migrate_add_must_change_password.js

          # Smart Sheets (collaborative spreadsheets). Safe, idempotent, additive-only
          # creation of smart_sheets / smart_sheet_access / smart_sheet_worksheets /
          # smart_sheet_cells in the legacy database and every registered tenant database
          # (every newly provisioned tenant already gets them from
          # tenantSchema.postgresql.sql). Only CREATE ... IF NOT EXISTS, one transaction
          # per database, never drops, alters or reads existing data. Must run BEFORE the
          # restart below: the new code queries these tables. Same `set -e` reasoning as
          # the steps above: a non-zero exit stops the deploy before the build/restart.
          # `--dry-run` previews it (never used here).
          node server/_migrate_add_smart_sheets.js

          cd client
          npm ci
          VITE_API_URL=https://crm.zioventure.com npm run build

          cd ..
          sudo systemctl restart reinsteins-crm

          sleep 3
          sudo systemctl is-active --quiet reinsteins-crm

          echo "Deployment successful"
